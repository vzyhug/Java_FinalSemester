<!DOCTYPE html>

<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}"><head>
<div layout:fragment="content">
    <div class="pt-20" style="padding: 80px">
    <!-- Expedition Scroller: Image Gallery -->
    <section class="relative w-full h-[400px] md:h-[600px] mb-12 group/carousel">
        <div id="slider" class="w-full h-full flex overflow-x-auto scroll-smooth snap-x snap-mandatory no-scrollbar gap-4">

            <div th:each="image: ${listImages}"
                 class="min-w-full md:min-w-[calc(100%-2rem)] h-full overflow-hidden rounded-xl group relative snap-start flex-shrink-0">
                <img th:alt="${image.imgURL}"
                     class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                     th:src="${image.imgURL}"/>
                <div
                     class="absolute bottom-6 left-6 bg-white/20 backdrop-blur-md px-4 py-2 rounded-lg border border-white/30 text-white text-sm font-medium">
                </div>
            </div>

        </div>

        <button onclick="scrollSlider(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white p-3 rounded-full opacity-0 group-hover/carousel:opacity-100 transition-opacity duration-300 backdrop-blur-sm z-10">
            &#10094; </button>
        <button onclick="scrollSlider(1)" class="absolute right-4 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white p-3 rounded-full opacity-0 group-hover/carousel:opacity-100 transition-opacity duration-300 backdrop-blur-sm z-10">
            &#10095; </button>
    </section>
    <!-- Content Layout with Sticky Sidebar -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
        <!-- Left Column: Details -->
        <div class="lg:col-span-2">
            <header class="mb-8">
                <div class="flex flex-wrap gap-2 mb-4">
                </div>
                <h1 th:text="${tourDetail.title}"
                    class="font-headline font-black text-5xl text-primary tracking-tight mb-4">
                </h1>
                <div class="flex items-center gap-4 text-slate-500">
                    <div class="flex items-center gap-1">
                        <span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">star</span>
                        <span class="font-bold text-on-surface"
                              th:text="${startAverage}"></span>
                        <span th:text="| (${totalReview} đánh giá) |"> Đánh giá</span>
                    </div>
                    <div class="w-1 h-1 bg-slate-300 rounded-full"></div>
                    <div class="flex items-center gap-1 text-primary">
                        <span class="material-symbols-outlined text-sm">location_on</span>
                        <span th:text="${tourDetail.province.provinceName}"
                              class="font-medium">
                        </span>
                    </div>
                </div>
            </header>
            <!-- Description Content -->
            <div class="space-y-12">
                <section>
                    <h2 class="font-headline font-bold text-2xl text-primary mb-6">Về chuyến đi</h2>
                    <p th:text="${tourDetail.description}"
                       class="text-on-surface-variant leading-relaxed text-lg mb-6">
                    </p>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                        <div class="bg-surface-container-low p-4 rounded-xl">
                            <span class="material-symbols-outlined text-secondary block mb-2">schedule</span>
                            <span class="text-xs text-slate-500 font-bold block">THỜI GIAN</span>
                            <span class="font-bold text-primary" th:text="|${tourDetail.durationDays} ngày - ${tourDetail.durationNights} đêm|">

                            </span>
                        </div>
                        <div class="bg-surface-container-low p-4 rounded-xl">
                            <span class="material-symbols-outlined text-secondary block mb-2">translate</span>
                            <span class="text-xs text-slate-500 font-bold block">NGÔN NGỮ</span>
                            <span class="font-bold text-primary">Tiếng Anh, Tiếng Việt</span>
                        </div>
                    </div>
                </section>
                <section class="bg-surface-container-low p-8 rounded-xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-4 opacity-10">
                        <span class="material-symbols-outlined text-9xl">map</span>
                    </div>
                    <h3 class="font-headline font-bold text-2xl text-primary mb-8">Lịch trình chi tiết</h3>
                    <div class="space-y-8 relative">
                        <div class="absolute left-[11px] top-4 bottom-4 w-0.5 bg-outline-variant"></div>
                        <div th:each="schedule: ${listSchedule}">
                        <div class="relative pl-10">
                            <div class="absolute left-0 top-1 w-6 h-6 rounded-full bg-primary border-4 border-surface-container-low"></div>
                            <h4 class="font-bold text-primary mb-2"
                                th:text="|Ngày ${schedule.dayNumber}: ${schedule.title}">
                            </h4>
                            <p th:text="${schedule.activities}"
                               class="text-on-surface-variant text-sm leading-relaxed">
                            </p>
                        </div>
                        </div>

                    </div>
                </section>
                <!-- Reviews Section -->
                <section>
                    <div class="flex justify-between items-end mb-8">
                        <div>
                            <h3 class="font-headline font-bold text-2xl text-primary mb-2">Tiếng nói lữ khách</h3>
                            <p class="text-slate-500"
                               th:text="|Dựa trên ${totalReview} đánh giá xác thực|"> </p>
                        </div>
                        <button class="text-primary font-bold border-b border-primary hover:text-secondary hover:border-secondary transition-colors">Xem tất cả</button>
                    </div>
                    <div class="space-y-6">
                        <div th:each="review: ${listReview}">
                            <div class="bg-surface-container-lowest p-6 rounded-xl editorial-shadow">
                                <div class="flex justify-between mb-4">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center font-bold text-primary"></div>
                                        <div>
                                            <p th:text="${review.customer.fullName}"
                                               class="font-bold text-on-surface">
                                            </p>
                                        </div>
                                    </div>
                                    <div class="flex text-secondary">
                                        <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
                                        <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
                                        <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
                                        <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
                                        <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
                                    </div>
                                </div>
                                <p th:text="${review.feedback}"
                                   class="text-on-surface-variant italic">

                                </p>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
        <!-- Right Column: Booking Sidebar -->
        <div class="lg:col-span-1">
            <div class="sticky top-28 space-y-6">
                <div class="bg-surface-container-lowest p-8 rounded-xl editorial-shadow border border-surface-container">
                    <div th:if="${message != null}" class="mb-4 p-3 bg-red-50 text-red-700 text-xs font-semibold rounded-lg border border-red-100">
                        <span th:text="${message}">
                        </span>
                    </div>
                    <form th:action="@{/booking}" method="GET" class="space-y-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">Chọn ngày khởi hành</label>
                            <div class="relative">
                                <select name="departureId" class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 font-medium text-on-surface focus:ring-2 focus:ring-primary/20" required="required">
                                    <option value="" disabled selected>-- Chọn ngày khởi hành --</option>
                                    <option th:each="departure : ${listDeparture}" 
                                            th:value="${departure.departureId}" 
                                            th:text="${#temporals.format(departure.departureDate, 'dd/MM/yyyy')} + ' (Còn ' + ${departure.availableSeats} + ' chỗ)'"></option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="w-full text-center bg-gradient-to-br from-primary to-primary-container text-white py-4 rounded-full font-black text-lg shadow-xl hover:shadow-primary/20 transition-all hover:-translate-y-1 block">
                            Xác nhận ngày đi
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    </div>
</div>

</html>

<script>
    function scrollSlider(direction)
    {
    const slider = document.getElementById('slider');
    // Lấy chiều rộng của một item ảnh hiện tại
    const itemWidth = slider.clientWidth;

    // Cuộn sang trái hoặc phải dựa vào hướng (direction: -1 hoặc 1)
    slider.scrollBy({
        left: direction * itemWidth,
        behavior: 'smooth'
    });
}
</script>
