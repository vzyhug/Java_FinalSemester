<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin_layout :: layout(~{:: #edit-customer-content})}">
<head>
    <title>Sửa Khách hàng - VietExpedition</title>
</head>
<body>
<div id="edit-customer-content" class="p-8">
    <div class="mb-8">
        <h1 class="text-3xl font-black text-amber-600 mb-2">Cập nhật Khách hàng</h1>
        <p class="text-slate-500">Chỉnh sửa thông tin liên hệ của khách hàng</p>
    </div>

    <div th:if="${error}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded-lg shadow-sm flex items-center max-w-2xl">
        <span class="material-symbols-outlined mr-2">error</span>
        <span th:text="${error}"></span>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 max-w-2xl">
        <form th:action="@{/customer/update}" th:object="${customer}" method="POST" class="space-y-6">

            <input type="hidden" th:field="*{customerId}" />

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Họ và Tên <span class="text-red-500">*</span></label>
                    <input type="text" th:field="*{fullName}" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-amber-500 outline-none" required/>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Số điện thoại <span class="text-red-500">*</span></label>
                    <input type="text" th:field="*{phone}" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-amber-500 outline-none" required/>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Email <span class="text-red-500">*</span></label>
                <input type="email" th:field="*{email}" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-amber-500 outline-none" required/>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Địa chỉ</label>
                <input type="text" th:field="*{address}" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-amber-500 outline-none" required/>
            </div>

            <div class="flex gap-4 pt-6 border-t border-slate-100">
                <button type="submit" class="bg-amber-500 text-white px-8 py-3 rounded-lg font-bold hover:bg-amber-600 transition">Cập nhật thay đổi</button>
                <a th:href="@{/customer}" class="bg-slate-100 text-slate-700 px-8 py-3 rounded-lg font-bold hover:bg-slate-200 transition">Hủy</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
