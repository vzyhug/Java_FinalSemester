<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin_layout :: layout(~{:: #customer-content})}">
<head>
  <title>Quản lý Khách hàng - VietExpedition</title>
</head>
<body>

<div id="customer-content" class="flex flex-col md:flex-row flex-1 overflow-hidden h-full">
  <div class="flex-1 flex flex-col h-full overflow-hidden">
    <div class="w-full px-8 py-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div class="space-y-1">
        <h2 class="text-3xl font-black text-blue-900 tracking-tight" style="color: #1e3a8a;">Danh sách khách hàng</h2>
        <p class="text-slate-500 font-medium">Quản lý hồ sơ, liên hệ và lịch sử trải nghiệm của khách hàng.</p>
      </div>
      <div class="flex items-center gap-3">
        <button class="bg-slate-200 text-blue-900 font-semibold px-6 py-3 rounded-full hover:bg-slate-300 transition-colors flex items-center gap-2 text-sm">
          <span class="material-symbols-outlined text-xl">file_download</span>Xuất báo cáo
        </button>
        <button class="bg-blue-900 text-white font-bold px-6 py-3 rounded-full shadow-lg shadow-blue-900/20 hover:scale-105 transition-all flex items-center gap-2 text-sm">
          <span class="material-symbols-outlined text-xl">person_add</span>Thêm khách hàng
        </button>
      </div>
    </div>

    <section class="px-8 grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 flex-shrink-0">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-2">
        <p class="text-slate-500 font-semibold text-sm">Tổng khách hàng</p>
        <p class="text-3xl font-black text-slate-800" th:text="${totalCustomers}">12,450</p>
      </div>
    </section>

    <section class="px-8 pb-8 flex-1 overflow-hidden flex flex-col">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 flex flex-col overflow-hidden">
        <div class="overflow-x-auto flex-1">
          <table class="w-full text-left border-collapse">
            <thead class="sticky top-0 bg-slate-50 z-10 border-b border-slate-200">
            <tr>
              <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Khách hàng</th>
              <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Thông tin liên hệ</th>
              <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">Địa chỉ</th>
              <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-center">Ngày tham gia</th>
              <!-- Thêm cột Trạng thái -->
              <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider text-center">Trạng thái</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="customer : ${customers}" class="hover:bg-slate-50/80 transition-colors group">
              <td class="px-6 py-4">
                <p class="font-bold text-slate-800" th:text="${customer.fullName}">Tên KH</p>
              </td>
              <td class="px-6 py-4" th:text="${customer.email}">Email</td>
              <td class="px-6 py-4" th:text="${customer.address}">Địa chỉ</td>
              <td class="px-6 py-4 text-center" th:text="${#strings.substring(customer.createdAt, 0, 10)}">Ngày</td>
              <!-- Nút Khóa / Mở khóa -->
              <td class="px-6 py-4 text-center">
                <form th:action="@{/customer/toggle-status}" method="post" class="inline m-0">
                  <input type="hidden" name="customerId" th:value="${customer.customerId}" />

                  <button type="submit"
                          th:classappend="${customer.getIsActive() != null && customer.getIsActive()} ? 'bg-green-100 text-green-700 hover:bg-green-200' : 'bg-red-100 text-red-700 hover:bg-red-200'"
                          class="px-4 py-1.5 rounded-full text-xs font-bold transition-colors inline-flex items-center gap-1"
                          th:title="${customer.getIsActive() != null && customer.getIsActive()} ? 'Nhấn để Khóa tài khoản' : 'Nhấn để Mở khóa tài khoản'"
                          onclick="return confirm('Bạn có chắc chắn muốn thay đổi trạng thái của khách hàng này?');">
                    <span class="material-symbols-outlined text-[16px]"
                          th:text="${customer.getIsActive() != null && customer.getIsActive()} ? 'lock_open' : 'lock'">
                    </span>
                    <span th:text="${customer.getIsActive() != null && customer.getIsActive()} ? 'Hoạt động' : 'Đã khóa'"></span>
                  </button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
</div>

</body>
</html>
