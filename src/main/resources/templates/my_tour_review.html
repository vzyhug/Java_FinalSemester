<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{user_layout}">

<div layout:fragment="content">
  <style>
    /* Ẩn các nút radio check gốc */
    .rating-wrapper input[type="radio"] {
      display: none;
    }
    /* Đảo ngược chiều hiển thị của flex để dùng selector '~' trong CSS */
    .rating-wrapper {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-end;
    }
    /* Màu mặc định của sao (Xám) */
    .rating-wrapper label {
      color: #cbd5e1;
      cursor: pointer;
      transition: color 0.2s;
    }
    /* Khi di chuột vào hoặc khi được check: đổi màu chính nó và các ngôi sao đứng ĐẰNG TRƯỚC nó */
    .rating-wrapper input[type="radio"]:checked ~ label,
    .rating-wrapper label:hover,
    .rating-wrapper label:hover ~ label {
      color: #ffb612;
    }
  </style>

  <div class="text-xs text-slate-400 mb-4">
    <a th:href="@{/customer/booking/{id}(id=${booking.idBooking})}" class="hover:text-primary flex items-center gap-1">
      <span class="material-symbols-outlined text-xs">arrow_back</span> Quay lại chi tiết chuyến đi
    </a>
  </div>

  <div class="mb-6">
    <h2 class="text-2xl font-black text-primary tracking-tight">Đánh giá chuyến đi của bạn</h2>
    <p class="text-xs text-slate-500 mt-1">
      Chia sẻ trải nghiệm thực tế của bạn tại
      <span class="font-bold text-slate-700" th:text="${booking.departure.tour.tourName}">Tên Tour</span> cùng Vietnam Expeditions.
    </p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

    <div class="lg:col-span-4 bg-surface-container-low rounded-xl p-5 border border-slate-100 space-y-4">
      <div class="h-44 rounded-lg overflow-hidden bg-slate-200">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=500&q=80" alt="Tour Image" class="w-full h-full object-cover">
      </div>
      <div>
        <span class="bg-secondary/10 text-secondary text-[10px] font-black uppercase px-2.5 py-1 rounded" th:text="${booking.departure.tour.category?.categoryName ?: 'MẠO HIỂM / KHÁM PHÁ'}">MẠO HIỂM / KHÁM PHÁ</span>
        <h3 class="text-lg font-bold text-primary mt-2" th:text="${booking.departure.tour.tourName}">Tên chuyến đi</h3>

        <div class="mt-3 space-y-1.5 text-xs text-slate-500">
          <div class="flex items-center gap-1.5">
            <span class="material-symbols-outlined text-sm">calendar_today</span>
            Khởi hành: <span th:text="${#dates.format(booking.departure.startDate, 'dd/MM/yyyy')}">12/04/2026</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="material-symbols-outlined text-sm">location_on</span>
            Điểm đến: <span th:text="${booking.departure.tour.destination ?: 'Việt Nam'}">Quảng Bình, Việt Nam</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="material-symbols-outlined text-sm">person</span>
            Mã đặt tour: #<span th:text="${booking.idBooking}">123</span>
          </div>
        </div>
      </div>
    </div>

    <div class="lg:col-span-8 bg-surface-container-lowest border border-slate-100 rounded-xl p-6 shadow-sm">

      <form th:action="@{/customer/booking/{id}/review/save_review(id=${booking.idBooking})}" method="POST" class="space-y-6">

        <div class="space-y-2">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">Bạn đánh giá tour này thế nào?</label>

          <div class="rating-wrapper flex items-center gap-1">

            <input type="radio" id="star5" name="rating" value="5" checked />
            <label for="star5" class="material-symbols-outlined text-3xl">star</label>

            <input type="radio" id="star4" name="rating" value="4" />
            <label for="star4" class="material-symbols-outlined text-3xl">star</label>

            <input type="radio" id="star3" name="rating" value="3" />
            <label for="star3" class="material-symbols-outlined text-3xl">star</label>

            <input type="radio" id="star2" name="rating" value="2" />
            <label for="star2" class="material-symbols-outlined text-3xl">star</label>

            <input type="radio" id="star1" name="rating" value="1" />
            <label for="star1" class="material-symbols-outlined text-3xl">star</label>

          </div>
        </div>

        <div class="space-y-2">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500">Cảm nhận của bạn</label>
          <textarea name="feedback" rows="4" required
                    placeholder="Chia sẻ những kỷ niệm đáng nhớ nhất hoặc những góp ý chân thành để chúng tôi hoàn thiện hơn..."
                    class="w-full bg-surface-container-low border border-slate-200 rounded-lg p-3 text-sm focus:ring-1 focus:ring-primary focus:bg-white transition-all"></textarea>
        </div>

        <div class="pt-4 border-t border-slate-100 flex justify-end gap-3">
          <a th:href="@{/customer/booking/{id}(id=${booking.idBooking})}"
             class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-600 rounded-lg transition-colors">
            Hủy bỏ
          </a>
          <button type="submit" class="px-6 py-2.5 bg-secondary hover:bg-[#822800] text-white text-xs font-bold rounded-lg shadow-sm transition-colors">
            Gửi đánh giá
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
</html>
