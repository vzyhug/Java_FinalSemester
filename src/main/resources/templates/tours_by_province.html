<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách tour theo tỉnh</title>
    <meta charset="UTF-8"/>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen text-gray-900">
<div class="p-8 max-w-6xl mx-auto">
    <!-- Header + Nút quay lại -->
    <div class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-extrabold text-blue-900">Danh sách tour</h2>
        <a th:href="@{/location_management}"
           class="inline-flex items-center gap-2 px-5 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition">
            <span class="material-symbols-outlined"></span>
            Quay lại quản lý địa điểm
        </a>
    </div>

    <!-- Grid Tour -->
    <!-- Grid OUTSIDE -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">

        <!-- Có tour -->
        <div th:if="${tours != null and !tours.isEmpty()}"
             th:each="tour : ${tours}"
             class="p-6 rounded-xl shadow-lg bg-white hover:shadow-2xl transition transform hover:-translate-y-1">

            <div class="mb-4">
                <img th:src="${tour.imagesThumbnails != null ? tour.imagesThumbnails.imgURL : 'https://placehold.co/400x200'}"
                     class="w-full h-40 object-cover rounded-lg"/>
            </div>

            <h3 class="font-bold text-lg text-blue-800 mb-2"
                th:text="${tour.title}"></h3>

            <p class="text-sm text-gray-600 mb-1">
                <span th:text="${tour.durationDays}"></span> ngày -
                <span th:text="${tour.durationNights}"></span> đêm
            </p>

            <p class="text-sm text-gray-600 mb-1"
               th:text="${tour.pickupPoint}"></p>

            <p class="text-sm font-bold text-green-700"
               th:text="${tour.minPrice}"></p>
        </div>

    </div>

    <div th:if="${tours == null or tours.isEmpty()}"
         class="text-center py-20">
        <p class="text-gray-500 text-lg">
            Không có tour nào trong khu vực này
        </p>
    </div>
</div>
</body>
</html>
