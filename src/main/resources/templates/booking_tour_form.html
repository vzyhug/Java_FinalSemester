<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}"><head>

<div layout:fragment="content">
<div class="pt-24 pb-12 px-4 md:px-6 max-w-7xl mx-auto">
    <div class="flex items-center gap-2 text-xs text-on-surface-variant mb-6 font-medium">
        <span class="material-symbols-outlined text-sm">laptop_mac</span>
        <span>Đặt tour - Vietnam Expeditions</span>
    </div>

    <div class="max-w-xl mx-auto mb-10 relative flex justify-between items-center text-xs font-bold text-on-surface-variant">
        <div class="absolute h-[2px] bg-surface-container-high w-full top-4 left-0 -z-10"></div>
        <div class="flex flex-col items-center gap-2">
            <span class="w-8 h-8 rounded-full bg-secondary text-white flex items-center justify-center text-sm">1</span>
            <span class="text-secondary">Chọn chuyến đi</span>
        </div>
        <div class="flex flex-col items-center gap-2">
            <span class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-sm">2</span>
            <span >Thông tin hành khách</span>
        </div>
        <div class="flex flex-col items-center gap-2 opacity-40">
            <span class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-sm">3</span>
            <span>Thanh toán</span>
        </div>
        <div class="flex flex-col items-center gap-2 opacity-40">
            <span class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-sm">4</span>
            <span>Hoàn tất</span>
        </div>
    </div>

    <form th:action="@{/booking/save_stage1}" method="POST">
        <input type="hidden" name="departureId" th:value="${departure.departureId}" />
        <input type="hidden" name="adultCount" th:value="${adultCount}" />
        <input type="hidden" name="childCount" th:value="${childCount}" />
        <input type="hidden" name="adultTotal" th:value="${adultTotal}" />
        <input type="hidden" name="childTotal" th:value="${childTotal}" />
        <input type="hidden" name="totalAll" th:value="${totalAll}" />
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        <div class="lg:col-span-8 space-y-6">
            <div class="bg-surface-container-lowest rounded-2xl p-6 shadow-sm border border-surface-container">
                <div class="flex items-center gap-2 mb-6 text-primary">
                    <span class="material-symbols-outlined font-bold">group</span>
                    <h2 class="font-headline font-bold text-lg">Số lượng hành khách</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex justify-between items-center bg-surface-container-low p-4 rounded-xl">
                        <div>
                            <p class="font-bold text-sm">Người lớn</p>
                            <p class="text-xs text-on-surface-variant">Trên 12 tuổi</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <a th:href="@{/booking(departureId=${departure.departureId}, adult=${adultCount > 1 ? adultCount - 1 : 1}, child=${childCount})}"
                               class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center font-bold text-lg hover:bg-slate-300 transition-colors select-none">-</a>

                            <span class="font-bold text-base" th:text="${adultCount}">1</span>

                            <a th:href="@{/booking(departureId=${departure.departureId}, adult=${adultCount + 1}, child=${childCount})}"
                               class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold text-lg hover:bg-primary-container transition-colors select-none">+</a>
                        </div>
                    </div>
                    <div class="flex justify-between items-center bg-surface-container-low p-4 rounded-xl">
                        <div>
                            <p class="font-bold text-sm">Trẻ em</p>
                            <p class="text-xs text-on-surface-variant">Từ 2 - 11 tuổi</p>
                        </div>
                        <div class="flex items-center gap-4">
                            <a th:href="@{/booking(departureId=${departure.departureId}, adult=${adultCount}, child=${childCount > 0 ? childCount - 1 : 0})}"
                               class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center font-bold text-lg hover:bg-slate-300 transition-colors select-none">-</a>

                            <span class="font-bold text-base" th:text="${childCount}">0</span>

                            <a th:href="@{/booking(departureId=${departure.departureId}, adult=${adultCount}, child=${childCount + 1})}"
                               class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold text-lg hover:bg-primary-container transition-colors select-none">+</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-surface-container-lowest rounded-2xl p-6 shadow-sm border border-surface-container">
                <div class="flex items-center gap-2 mb-6 text-primary">
                    <span class="material-symbols-outlined font-bold">badge</span>
                    <h2 class="font-headline font-bold text-lg">Thông tin liên hệ</h2>
                </div>
                <div class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-on-surface-variant px-1">Họ và tên *</label>
                            <input type="text" name="userFullName" placeholder="Nhập họ tên đầy đủ" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 text-sm focus:bg-white focus:ring-2 focus:ring-primary transition-all" th:value="${userFullName}"/>
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-on-surface-variant px-1">Số điện thoại *</label>
                            <input type="text" name="userPhone" placeholder="Ví dụ: 0912 345 678" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 text-sm focus:bg-white focus:ring-2 focus:ring-primary transition-all" th:value="${userPhone}"/>
                        </div>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-on-surface-variant px-1">Email *</label>
                        <input type="email" name="userEmail" placeholder="Địa chỉ email của bạn" class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 text-sm focus:bg-white focus:ring-2 focus:ring-primary transition-all" th:value="${userEmail}"/>
                    </div>
                </div>
            </div>

            <div class="flex justify-end">
                <button type="submit" class="px-8 py-2.5 bg-gradient-to-br from-primary to-primary-container text-white rounded-full font-bold shadow-lg hover:opacity-90 transition-transform active:scale-95 flex items-center gap-1">
                    Tiếp tục đặt tour
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
                </button>
            </div>
        </div>

        <div class="lg:col-span-4">
            <div class="bg-surface-container-lowest rounded-2xl p-5 shadow-sm border border-surface-container">
                <div class="rounded-xl overflow-hidden mb-4 h-44 relative">
                    <img th:src="${tour.imagesThumbnails!=null ? tour.imagesThumbnails.imgURL: ''}"
                         alt="Tour Image"
                         class="w-full h-full object-cover"/>
                    <span class="absolute top-3 left-3 bg-teal-600 text-white text-[10px] font-bold px-2 py-1 rounded" th:text="|${tour.durationDays} ngày ${tour.durationNights} đêm|"></span>
                </div>
                <h3 class="font-headline font-bold text-base text-primary mb-1" th:text="${tour.title}"></h3>
                <div class="flex flex-col gap-1 text-xs text-on-surface-variant mb-4">
                    <div class="flex items-center gap-1">
                        <span class="material-symbols-outlined text-xs">location_on</span>
                        <span>Khởi hành:
                            <span th:text="${tour.pickupPoint}">
                            </span>
                        </span>
                    </div>
                    <div class="flex items-center gap-1 mt-1 font-semibold text-blue-700">
                        <span class="material-symbols-outlined text-xs">calendar_month</span>
                        <span>Ngày đi:
                            <span th:text="${#temporals.format(departure.departureDate, 'dd/MM/yyyy')}">
                            </span>
                        </span>
                    </div>
                </div>
                <div class="border-t border-surface-container-high pt-4 space-y-2 text-xs">
                    <div class="flex justify-between">
                        <span class="text-on-surface-variant" th:text="|Người lớn (x${adultCount})|"></span>
                        <span class="font-semibold" th:text="${#numbers.formatDecimal(adultTotal, 0, 'COMMA', 0, 'POINT')} + 'VNĐ'"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-on-surface-variant">Trẻ em (x<span th:text="${childCount}">0</span>)</span>
                        <span class="font-semibold" th:text="${#numbers.formatDecimal(childTotal, 0, 'COMMA', 0, 'POINT')} + 'VNĐ'"></span>
                    </div>
                    <div class="flex justify-between items-end border-t border-surface-container pt-3 mt-2">
                        <span class="font-bold text-sm text-on-surface">Tổng cộng</span>
                        <span class="text-2xl font-black text-secondary" th:text="${#numbers.formatDecimal(totalAll, 0, 'COMMA', 0, 'POINT')} + 'VNĐ'"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </form>
</div>
</div>

</html>
