<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập | Vietnam Expeditions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)),
            url('https://images.unsplash.com/photo-1528127269322-539801943592?q=80&w=2070'); /* Ảnh Vịnh Hạ Long */
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }
        .auth-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(5px);
            background: rgba(255, 255, 255, 0.95);
        }
        .btn-primary-custom {
            background-color: #2D318C; /* Màu từ giao diện web */
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary-custom:hover {
            background-color: #1a1d5a;
            transform: translateY(-1px);
        }
        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        .form-control:focus {
            border-color: #2D318C;
            box-shadow: 0 0 0 0.25rem rgba(45, 49, 140, 0.1);
        }
        .nav-pills .nav-link {
            color: #6c757d;
            font-weight: 600;
            border-radius: 8px;
            padding: 8px 16px;
            transition: all 0.2s;
        }
        .nav-pills .nav-link.active {
            background-color: #2D318C !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card auth-card p-4">
                <div class="text-center mb-4">
                    <a th:href="@{/}" style="text-decoration: none;"><h2 style="color: #2D318C; font-weight: 700;">Vietnam Expeditions</h2></a>
                    <p class="text-muted">Chào mừng bạn trở lại!</p>
                </div>

                <form th:action="@{/login}" method="post">

                    <div th:if="${error}" class="alert alert-danger text-center small p-2 mb-3">
                        <span th:text="${error}"></span>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Tên đăng nhập hoặc Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text"
                                   name="usernameOrEmail"
                                   class="form-control"
                                   placeholder="Nhập email hoặc tài khoản..."
                                   required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label small" for="rememberMe">Ghi nhớ tôi</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 text-white mb-3">Đăng nhập</button>

                    <div class="text-center" id="registerBlock">
                        <p class="small mb-0">Bạn chưa có tài khoản?
                            <a th:href="@{/customer/registerForm}" class="fw-bold text-decoration-none" style="color: #2D318C;">Đăng ký ngay</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
<!-- ==============================================
     JAVASCRIPT: JWT + 20 PHÚT LOCALSTORAGE
     ============================================== -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        checkSession();
    });

    // Hàm tự động check hạn 20 phút mỗi khi vào trang web (có thể bỏ vào thẻ <head> của file layout chung)
    function checkSession() {
        const token = localStorage.getItem('jwtToken');
        const expirationTime = localStorage.getItem('tokenExpiration');

        if (token && expirationTime) {
            const currentTime = new Date().getTime();
            if (currentTime > parseInt(expirationTime)) {
                console.log("Phiên đã hết hạn (quá 20 phút). Đang xóa...");
                handleLogoutClient();
            } else {
                console.log("Còn lại: " + Math.round((parseInt(expirationTime) - currentTime) / 60000) + " phút");
            }
        }
    }

    function handleLogoutClient() {
        localStorage.removeItem('jwtToken');
        localStorage.removeItem('tokenExpiration');
        // Gọi API hoặc redirect để xóa session phía server
        window.location.href = '/customer/logout';
    }
</script>
</html>
