<!DOCTYPE html>


<html lang="vi"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{user_layout}">

<div layout:fragment="content">
  <div class="max-w-5xl mx-auto">
    <!-- Hero Header -->
    <div class="relative h-64 rounded-xl overflow-hidden mb-8 group">
      <img alt="Background" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="panoramic landscape of Ha Long Bay at sunrise with limestone karsts and traditional junk boats in calm emerald water" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC_vRVIEVkoeUzCaq1WZgUKBeGY_js8wt6rX40Cp0fk-gtQj_1lDnfZh555IVu5U8KX4IANtYt_JBmG_Et6jU5DC8YmulnjM-S4I0i1RbbWf_4JlNS3jA-IuKn-21FDdCW66Ky3p-rnsB5QqT563p1BLhcQ8PLFEreCImX3CZLEiVStXKOp92m8mivTz7fFXDUfUHM4zFpNOBU-HHlG3vjRdt3MWOzeriQK4jm4q948VSRSRAi4S4ss3jBR8G3gCvDtQ-O0Ylvn3UR2"/>
      <div class="absolute inset-0 bg-gradient-to-t from-blue-900/80 via-transparent to-transparent"></div>
      <div class="absolute bottom-8 left-8 flex items-end gap-6">
        <div class="relative">
          <img alt="Avatar" class="w-32 h-32 rounded-xl object-cover border-4 border-white shadow-xl" data-alt="high-quality profile portrait of a stylish man in his 30s with short black hair and friendly expression" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCN-dzNQQE2IG14krlXMOwK3KLG1LoJ1icC_kMhn0FqubQbRPtFfTfwP6g3RSBnHFkP058WqBP-X3g2-_Ip1GQcqOYqlo050oYYQvwmtMFg7-d7t8OEgNHrTtps-p5caK8sleYR_I02VBs77cJVhI6cKFfiOFgRIbKq6xs4KiUSu_kqwmVj4oYx43YyINpkxMWY8CuEkW3tRAZ8N68aGhkuos_YGh6nWP42_ZzwRXY7m71W6c0UubPjBRCCM3U6IE2b0XJT1HoYyZT5"/>
          <button class="absolute -bottom-2 -right-2 bg-secondary text-white p-2 rounded-full shadow-lg hover:scale-110 transition-transform">
            <span class="material-symbols-outlined text-sm">edit</span>
          </button>
        </div>
        <div class="pb-2">
          <h1 class="text-3xl font-extrabold text-white tracking-tight"
              th:text="${customer.fullName}">
          </h1>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Personal Info Section (Bento Block) -->
      <div class="lg:col-span-2 space-y-8">
        <section class="bg-surface-container-lowest p-8 rounded-xl shadow-sm border border-outline-variant/10">
          <div class="flex justify-between items-center mb-8">
            <div>
              <h2 class="text-xl font-bold text-primary">Thông Tin Cá Nhân</h2>
              <p class="text-sm text-slate-500 mt-1">Cập nhật chi tiết để chúng tôi phục vụ bạn tốt hơn</p>
            </div>
            <button class="flex items-center gap-2 px-4 py-2 text-primary font-bold hover:bg-primary/5 rounded-full transition-colors">
              <span class="material-symbols-outlined text-lg">edit_note</span>
              Chỉnh sửa
            </button>
          </div>
          <form th:action="@{/customer/profile/update}" method="post"
                class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <div class="space-y-2">
              <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Họ và Tên</label>
              <input name="fullName"
                     class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3 text-on-surface focus:ring-2 focus:ring-surface-tint focus:bg-surface-container-lowest transition-all"
                     type="text"
                     th:value="${customer.fullName}"/>
            </div>

            <div class="space-y-2">
              <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Email</label>
              <input name="email"
                     class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3 text-on-surface focus:ring-2 focus:ring-surface-tint focus:bg-surface-container-lowest transition-all"
                     type="email"
                     th:value="${customer.email}"/>
            </div>

            <div class="space-y-2">
              <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Số Điện Thoại</label>
              <input name="phone"
                     class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3 text-on-surface focus:ring-2 focus:ring-surface-tint focus:bg-surface-container-lowest transition-all"
                     type="tel"
                     th:value="${customer.phone}"/>
            </div>

            <div class="md:col-span-2 space-y-2">
              <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Địa Chỉ Thường Trú</label>
              <input name="address"
                     class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3 text-on-surface focus:ring-2 focus:ring-surface-tint focus:bg-surface-container-lowest transition-all"
                     type="text"
                     th:value="${customer.address}"/>
            </div>

            <div class="md:col-span-2 flex justify-end gap-4 mt-4">
              <button class="px-8 py-3 bg-gradient-to-r from-primary to-primary-container text-white rounded-full font-bold shadow-md hover:shadow-lg transition-all active:scale-95" type="submit">
                Lưu Thay Đổi
              </button>
            </div>
          </form>

        </section>
      </div>
      <!-- Security & Sidebar Content -->
      <div class="space-y-8">
        <section class="bg-surface-container-lowest p-8 rounded-xl shadow-sm border border-outline-variant/10">
          <h2 class="text-xl font-bold text-primary mb-6">Bảo Mật</h2>

          <form th:action="@{/customer/change-password}" method="post" class="space-y-6">

            <div class="space-y-2">
              <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">
                Mật khẩu hiện tại
              </label>

              <input name="currentPassword"
                     class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-surface-tint transition-all"
                     placeholder="••••••••"
                     type="password"
                     required/>
            </div>

            <div class="space-y-2">
              <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">
                Mật khẩu mới
              </label>

              <input name="newPassword"
                     class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-surface-tint transition-all"
                     placeholder="••••••••"
                     type="password"
                     required/>
            </div>

            <div class="space-y-2">
              <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">
                Xác nhận mật khẩu
              </label>

              <input name="confirmPassword"
                     class="w-full bg-surface-container-high border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-surface-tint transition-all"
                     placeholder="••••••••"
                     type="password"
                     required/>
            </div>

            <div th:if="${message}"
                 class="bg-green-100 text-green-700 p-3 rounded-lg text-sm">
              <span th:text="${message}"></span>
            </div>

            <div th:if="${error}"
                 class="bg-red-100 text-red-700 p-3 rounded-lg text-sm">
              <span th:text="${error}"></span>
            </div>
            <button class="w-full py-3 bg-surface-container-highest text-primary font-bold rounded-full hover:bg-primary hover:text-white transition-all duration-300"
                    type="submit">
              Cập Nhật Mật Khẩu
            </button>
          </form>
        </section>
      </div>
    </div>
    <!-- Footer-style spacer for content flow -->
    <div class="mt-20 pt-10 border-t border-outline-variant/10 flex flex-col md:flex-row justify-between items-center gap-4 text-slate-400 text-sm font-medium">
      <p>© 2024 Vietnam Expeditions. All rights reserved.</p>
      <div class="flex gap-8">
        <a class="hover:text-primary transition-colors" href="#">Chính sách bảo mật</a>
        <a class="hover:text-primary transition-colors" href="#">Điều khoản dịch vụ</a>
      </div>
    </div>
  </div>
</div>
<!-- Mobile Navigation Shell -->
<nav class="md:hidden fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-xl border-t border-outline-variant/10 flex justify-around py-3 px-6 z-50">
  <button class="flex flex-col items-center gap-1 text-slate-400">
    <span class="material-symbols-outlined">explore</span>
    <span class="text-[10px] font-bold">Khám phá</span>
  </button>
  <button class="flex flex-col items-center gap-1 text-slate-400">
    <span class="material-symbols-outlined">confirmation_number</span>
    <span class="text-[10px] font-bold">Đặt chỗ</span>
  </button>
  <button class="flex flex-col items-center gap-1 text-primary">
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
    <span class="text-[10px] font-bold">Cá nhân</span>
  </button>
  <button class="flex flex-col items-center gap-1 text-slate-400">
    <span class="material-symbols-outlined">more_horiz</span>
    <span class="text-[10px] font-bold">Thêm</span>
  </button>
</nav>
</div>
</html>
