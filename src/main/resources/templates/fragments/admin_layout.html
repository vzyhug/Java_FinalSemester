<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Expedition Admin - Vietnam Expeditions</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: { primary: "#1e3a8a", secondary: "#64748b", accent: "#3b82f6" }
            }
        }
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Public Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-x-hidden">

<aside class="hidden md:flex flex-col h-screen w-64 fixed left-0 top-0 z-50 bg-slate-50 py-6 border-r border-slate-200">
  <div class="px-6 mb-8">
    <h1 class="text-lg font-black text-blue-900 mb-1 tracking-tighter">Admin Portal</h1>
    <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Vietnam Expedition</p>
  </div>
  <nav class="flex-1 space-y-1">
    <a class="rounded-xl mx-2 my-1 px-4 py-3 flex items-center gap-3 transition-all font-semibold text-sm"
       th:classappend="${#execInfo.templateName.contains('admin_dashboard_management')} ? 'bg-blue-50 text-blue-900 font-bold' : 'text-slate-600 hover:bg-slate-100'" th:href="@{/admin/dashboard}">
      <span class="material-symbols-outlined">dashboard</span><span>Dashboard</span>
    </a>

    <a class="rounded-xl mx-2 my-1 px-4 py-3 flex items-center gap-3 transition-all font-semibold text-sm"
       th:classappend="${#execInfo.templateName.contains('admin_tour_management')} ? 'bg-blue-50 text-blue-900 font-bold' : 'text-slate-600 hover:bg-slate-100'" th:href="@{/tour/manager}">
      <span class="material-symbols-outlined">confirmation_number</span><span>Quản lý Tour</span>
    </a>

    <a class="rounded-xl mx-2 my-1 px-4 py-3 flex items-center gap-3 transition-all font-semibold text-sm"
       th:classappend="${#execInfo.templateName.contains('admin_customer_management')} ? 'bg-blue-50 text-blue-900 font-bold' : 'text-slate-600 hover:bg-slate-100'" th:href="@{/customer}">
      <span class="material-symbols-outlined">group</span><span>Quản lý Khách hàng</span>
    </a>

    <a class="rounded-xl mx-2 my-1 px-4 py-3 flex items-center gap-3 transition-all font-semibold text-sm"
       th:classappend="${#execInfo.templateName.contains('admin_trip_management')} ? 'bg-blue-50 text-blue-900 font-bold' : 'text-slate-600 hover:bg-slate-100'" th:href="@{/admin/departures}">
      <span class="material-symbols-outlined">map</span><span>Quản lý Chuyến đi</span>
    </a>

    <a class="text-slate-600 hover:bg-slate-100 rounded-xl mx-2 my-1 px-4 py-3 flex items-center gap-3 transition-all font-semibold text-sm" href="#">
      <span class="material-symbols-outlined">location_on</span><span>Quản lý Địa điểm</span>
    </a>
    <a class="text-slate-600 hover:bg-slate-100 rounded-xl mx-2 my-1 px-4 py-3 flex items-center gap-3 transition-all font-semibold text-sm" href="#">
      <span class="material-symbols-outlined">payments</span><span>Quản lý Giao dịch</span>
    </a>
    <a class="text-slate-600 hover:bg-slate-100 rounded-xl mx-2 my-1 px-4 py-3 flex items-center gap-3 transition-all font-semibold text-sm" href="#">
      <span class="material-symbols-outlined">badge</span><span>Quản lý Nhân viên</span>
    </a>
  </nav>
  <div class="px-4 mt-auto border-t border-slate-200 pt-4">
    <a class="text-red-500 hover:bg-red-50 rounded-xl px-4 py-2 flex items-center gap-3 transition-all text-sm font-semibold" th:href="@{/admin/logout}">
      <span class="material-symbols-outlined">logout</span><span>Logout</span>
    </a>
  </div>
</aside>

<main class="md:ml-64 min-h-screen">
  <header class="flex justify-between items-center w-full px-6 h-16 sticky top-0 bg-slate-50/80 backdrop-blur-xl z-40 shadow-sm">
    <div class="flex items-center gap-4 flex-1">
      <form th:action="@{/admin/search}" method="GET" class="relative w-full max-w-md">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">search</span>
        <input
                class="w-full pl-10 pr-4 py-2 bg-slate-100/50 border-none rounded-full text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-900"
                placeholder="Tìm nhanh mã đơn, khách hàng, tour..."
                name="globalKeyword"
                th:value="${param.globalKeyword}"
                type="text"
        />
      </form>
    </div>

    <div class="flex items-center gap-4">
      <div class="text-right hidden sm:block">
        <p class="text-sm font-bold text-blue-900 leading-none" th:text="${admin != null ? admin.fullName : 'Hệ thống Admin'}">Admin User</p>
        <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-tighter mt-1"
           th:text="${admin != null && admin.role != null ? admin.role.roleName : 'Quản trị viên'}">Quản trị viên</p>
      </div>

      <div class="w-10 h-10 rounded-full border border-slate-200 overflow-hidden shadow-sm">
        <img th:src="${admin != null ? 'https://ui-avatars.com/api/?name=' + #strings.replace(admin.fullName,' ','+') + '&background=1e3a8a&color=fff' : 'https://ui-avatars.com/api/?name=Admin&background=1e3a8a&color=fff'}"
             alt="Admin Profile"
             class="w-full h-full object-cover"/>
      </div>
    </div>
  </header>

  <div th:insert="${content}"></div>
</main>

</body>
</html>
