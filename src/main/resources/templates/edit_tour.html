<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin_layout :: layout(~{:: #edit-tour-content})}">
<head>
    <title>Cập nhật Tour - Vietnam Expeditions</title>
</head>
<body>
<div id="edit-tour-content" class="p-8">

    <div class="mb-8 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-black text-orange-600 mb-2">Cập nhật Tour</h1>
            <p class="text-slate-500">Chỉnh sửa thông tin chi tiết của chuyến đi</p>
        </div>
        <a th:href="@{/tour/manager}" class="bg-white border border-slate-200 text-slate-700 px-5 py-2.5 rounded-full font-bold hover:bg-slate-50 transition flex items-center shadow-sm">
            <span class="material-symbols-outlined text-sm mr-2">arrow_back</span> Quay lại
        </a>
    </div>

    <div th:if="${error}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded-lg shadow-sm flex items-center max-w-4xl">
        <span class="material-symbols-outlined mr-2">error</span>
        <span th:text="${error}"></span>
    </div>

    <div th:if="${message}" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 mb-6 rounded-lg shadow-sm flex items-center max-w-4xl">
        <span class="material-symbols-outlined mr-2">check_circle</span>
        <span th:text="${message}"></span>
    </div>
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 max-w-4xl">
        <form th:action="@{/tour/update}" method="POST" class="space-y-6">

            <input type="hidden" name="tourId" th:value="${tour.tourId}" />

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Tên Tour <span class="text-red-500">*</span></label>
                        <input type="text" name="title" th:value="${tour.title}" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition" required/>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Danh mục <span class="text-red-500">*</span></label>
                        <select name="categoryId" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition" required>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.categoryId}"
                                    th:text="${cat.categoryName}"
                                    th:selected="${tour.category != null && tour.category.categoryId == cat.categoryId}">
                            </option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Địa điểm (Tỉnh/Thành) <span class="text-red-500">*</span></label>
                        <select name="provinceId" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition" required>
                            <option th:each="prov : ${provinces}"
                                    th:value="${prov.provinceId}"
                                    th:text="${prov.provinceName}"
                                    th:selected="${tour.province != null && tour.province.provinceId == prov.provinceId}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Số ngày <span class="text-red-500">*</span></label>
                            <input type="number" name="durationDays" th:value="${tour.durationDays}" min="1" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-orange-500 outline-none transition" required/>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Số đêm <span class="text-red-500">*</span></label>
                            <input type="number" name="durationNights" th:value="${tour.durationNights}" min="0" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-orange-500 outline-none transition" required/>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Điểm đón khách (Pickup Point)</label>
                        <input type="text" name="pickupPoint" th:value="${tour.pickupPoint}" placeholder="VD: Sân bay Tân Sơn Nhất" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-orange-500 outline-none transition"/>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Trạng thái hiện tại</label>
                        <span th:if="${tour.isActive}" class="px-4 py-2 bg-green-100 text-green-700 font-bold rounded-lg inline-flex items-center gap-2">
                            <span class="material-symbols-outlined">check_circle</span> Đang hoạt động
                        </span>
                        <span th:unless="${tour.isActive}" class="px-4 py-2 bg-red-100 text-red-700 font-bold rounded-lg inline-flex items-center gap-2">
                            <span class="material-symbols-outlined">cancel</span> Đã tạm ngưng
                        </span>
                    </div>
                </div>
            </div>

            <div class="pt-2">
                <label class="block text-sm font-bold text-slate-700 mb-2">Mô tả Tour</label>
                <textarea name="description" th:text="${tour.description}" rows="4" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition"></textarea>
            </div>

            <div class="flex gap-4 pt-6 border-t border-slate-100 mt-8">
                <button type="submit" class="bg-orange-500 text-white px-8 py-3 rounded-xl font-bold hover:bg-orange-600 transition flex items-center gap-2 shadow-lg shadow-orange-500/30">
                    <span class="material-symbols-outlined">save</span> Lưu Thay Đổi
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
