<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin_layout :: layout(~{:: #province-content})}"
>
<div id="province-content">
    <head>
        <meta charset="UTF-8">
        <title>Thêm địa điểm</title>

        <script src="https://cdn.tailwindcss.com"></script>

        <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap"
              rel="stylesheet">

        <style>
            body{
                font-family: 'Be Vietnam Pro', sans-serif;
            }
        </style>
    </head>

    <body class="bg-[#f6f7fb] min-h-screen">

    <div class="max-w-3xl mx-auto py-12">

        <!-- TITLE -->
        <div class="mb-10">
            <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider">
                Quản lý địa điểm
            </p>

            <h1 class="text-5xl font-black text-slate-900 mt-2">
                Thêm địa điểm mới
            </h1>
        </div>

        <!-- CARD -->
        <div class="bg-white rounded-[32px] shadow-sm border border-slate-100 p-10">

            <div class="flex items-center gap-3 mb-8">
                <span class="text-blue-600 text-3xl">ⓘ</span>

                <h2 class="text-3xl font-bold text-slate-800">
                    Thông tin cơ bản
                </h2>
            </div>

            <form th:action="@{/provinces/save}"
                  th:object="${province}"
                  method="post"
                  class="space-y-8">

                <!-- NAME -->
                <div>
                    <label class="block text-lg font-semibold mb-3 text-slate-700">
                        Tên tỉnh thành
                    </label>

                    <input type="text"
                           th:field="*{provinceName}"
                           placeholder="Ví dụ: Lâm Đồng"
                           class="w-full border border-slate-200 rounded-2xl px-6 py-5 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- ERROR -->
                <div th:if="${error}"
                     class="mb-6 bg-red-100 border border-red-300 text-red-700 px-5 py-4 rounded-2xl">

                    <span th:text="${error}"></span>

                </div>

                <!-- REGION -->
                <div>
                    <label class="block text-lg font-semibold mb-3 text-slate-700">
                        Vùng miền
                    </label>

                    <select th:field="*{region}"
                            class="w-full border border-slate-200 rounded-2xl px-6 py-5 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500">

                        <option value="">
                            Chọn vùng miền
                        </option>

                        <option th:each="r : ${regions}"
                                th:value="${r}"
                                th:text="${r}">
                        </option>

                    </select>
                </div>

                <!-- BUTTON -->
                <div class="flex gap-4 pt-4">

                    <a th:href="@{/provinces}"
                       class="px-8 py-4 rounded-2xl border border-slate-300 font-bold text-slate-600 hover:bg-slate-100 transition">
                        Hủy bỏ
                    </a>

                    <button type="submit"
                            class="px-8 py-4 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold shadow-lg transition">
                        Lưu địa điểm
                    </button>

                </div>

            </form>

        </div>

    </div>

    </body>

</div>
</html>
