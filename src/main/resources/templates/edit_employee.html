<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa nhân viên</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
          rel="stylesheet">

</head>

<body class="bg-slate-100 min-h-screen flex">

<!-- SIDEBAR -->
<aside class="w-72 bg-white border-r min-h-screen p-4">

    <h1 class="text-2xl font-black text-blue-700 mb-8">
        VietExpedition
    </h1>

    <nav class="space-y-2">

        <a href="#"
           class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-50 text-blue-700 font-semibold">

            <span class="material-symbols-outlined">
                badge
            </span>

            Quản lý nhân viên

        </a>

    </nav>

</aside>

<!-- MAIN -->
<main class="flex-1 p-8">

    <!-- HEADER -->
    <header class="flex justify-between items-center mb-8">

        <div>

            <nav class="flex items-center gap-2 text-sm text-slate-500 mb-2">

                <span>Quản lý nhân viên</span>

                <span class="material-symbols-outlined text-[18px]">
                    chevron_right
                </span>

                <span class="text-blue-700 font-semibold">
                    Chỉnh sửa nhân viên
                </span>

            </nav>

            <h2 class="text-3xl font-black text-slate-800">

                Chỉnh sửa nhân viên

            </h2>

            <p class="text-slate-500 mt-1">

                Cập nhật thông tin nhân viên trong hệ thống

            </p>

        </div>

        <!-- BACK -->
        <a th:href="@{/employees}"
           class="bg-slate-200 hover:bg-slate-300 px-5 py-3 rounded-2xl font-semibold">

            Quay lại

        </a>

    </header>

    <!-- FORM -->
    <div class="bg-white rounded-3xl shadow-sm p-8 max-w-5xl">

        <form th:action="@{/employees/update}"
              th:object="${employee}"
              method="post">

            <!-- ID -->
            <input type="hidden"
                   th:field="*{employeeId}">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <!-- FULL NAME -->
                <div>

                    <label class="block mb-2 font-semibold">
                        Họ và tên
                    </label>

                    <input type="text"
                           th:field="*{fullName}"
                           class="w-full border border-slate-300 rounded-2xl px-4 py-3">

                </div>

                <!-- EMAIL -->
                <div>

                    <label class="block mb-2 font-semibold">
                        Email
                    </label>

                    <input type="email"
                           th:field="*{email}"
                           class="w-full border border-slate-300 rounded-2xl px-4 py-3">

                </div>

                <!-- PHONE -->
                <div>

                    <label class="block mb-2 font-semibold">
                        Số điện thoại
                    </label>

                    <input type="text"
                           th:field="*{phone}"
                           class="w-full border border-slate-300 rounded-2xl px-4 py-3">

                </div>

                <!-- USERNAME -->
                <div>

                    <label class="block mb-2 font-semibold">
                        Username
                    </label>

                    <input type="text"
                           th:field="*{username}"
                           class="w-full border border-slate-300 rounded-2xl px-4 py-3">

                </div>

                <!-- PASSWORD -->
                <div>

                    <label class="block mb-2 font-semibold">
                        Mật khẩu
                    </label>

                    <input type="password"
                           th:field="*{passwordHash}"
                           class="w-full border border-slate-300 rounded-2xl px-4 py-3">

                </div>

                <!-- ROLE -->
                <div>

                    <label class="block mb-2 font-semibold">
                        Vai trò
                    </label>

                    <select name="roleId"
                            class="w-full border border-slate-300 rounded-2xl px-4 py-3">

                        <option th:each="role : ${roles}"
                                th:value="${role.roleId}"
                                th:text="${role.roleName}"
                                th:selected="${employee.role.roleId == role.roleId}">
                        </option>

                    </select>

                </div>

            </div>

            <!-- ACTIVE -->
            <div class="mt-6">

                <label class="flex items-center gap-3">

                    <input type="checkbox"
                           th:field="*{isActive}"
                           class="w-5 h-5">

                    Đang hoạt động

                </label>

            </div>

            <!-- BUTTON -->
            <div class="mt-8 flex gap-4">

                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-2xl">

                    Cập nhật nhân viên

                </button>

                <a th:href="@{/employees}"
                   class="bg-slate-200 hover:bg-slate-300 px-6 py-3 rounded-2xl font-semibold">

                    Hủy

                </a>

            </div>

        </form>

    </div>

</main>

</body>
</html>
