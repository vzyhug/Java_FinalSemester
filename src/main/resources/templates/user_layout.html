<!DOCTYPE html>


<html class="light" lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "surface-bright": "#f9f9ff",
              "secondary-fixed-dim": "#ffb59c",
              "inverse-surface": "#2e3037",
              "surface-variant": "#e1e2ea",
              "on-tertiary": "#ffffff",
              "on-primary-container": "#bbd0ff",
              "on-secondary-container": "#6b1f00",
              "tertiary": "#722b00",
              "inverse-primary": "#acc7ff",
              "error": "#ba1a1a",
              "on-secondary-fixed": "#380c00",
              "outline": "#727784",
              "on-surface-variant": "#424752",
              "surface-container": "#ededf6",
              "primary-fixed-dim": "#acc7ff",
              "tertiary-fixed-dim": "#ffb694",
              "surface-container-high": "#e7e8f0",
              "surface-dim": "#d9d9e2",
              "secondary-fixed": "#ffdbcf",
              "on-tertiary-container": "#ffc2a7",
              "on-secondary": "#ffffff",
              "surface": "#f9f9ff",
              "surface-container-low": "#f2f3fc",
              "tertiary-fixed": "#ffdbcc",
              "on-error-container": "#93000a",
              "on-primary-fixed-variant": "#004491",
              "on-error": "#ffffff",
              "error-container": "#ffdad6",
              "primary-fixed": "#d7e2ff",
              "tertiary-container": "#983c00",
              "surface-container-lowest": "#ffffff",
              "surface-tint": "#115cb9",
              "on-background": "#191c21",
              "surface-container-highest": "#e1e2ea",
              "primary": "#003f87",
              "outline-variant": "#c2c6d4",
              "on-primary-fixed": "#001a40",
              "on-secondary-fixed-variant": "#822800",
              "primary-container": "#0056b3",
              "background": "#f9f9ff",
              "secondary": "#a43c12",
              "secondary-container": "#fe7e4f",
              "on-tertiary-fixed-variant": "#7b2f00",
              "on-tertiary-fixed": "#351000",
              "on-surface": "#191c21",
              "on-primary": "#ffffff",
              "inverse-on-surface": "#f0f0f9"
            },
            "borderRadius": {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "1.5rem",
              "full": "9999px"
            },
            "fontFamily": {
              "headline": ["Be Vietnam Pro"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
      h1, h2, h3 { font-family: 'Be Vietnam Pro', sans-serif; }
    </style>
  </head>
  <body class="bg-surface text-on-surface selection:bg-primary-container selection:text-primary min-h-screen">
  <!-- TopAppBar -->
  <header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl font-['Be_Vietnam_Pro'] antialiased shadow-sm shadow-[0_1px_0_0_rgba(0,0,0,0.05)] flex justify-between items-center px-8 h-20">
    <div class="text-2xl font-bold tracking-tighter text-blue-900 dark:text-blue-400 cursor-pointer active:scale-95 duration-200">
      Vietnam Expeditions
    </div>
    <div class="flex items-center gap-6">
      <div class="hidden md:flex items-center bg-surface-container rounded-full px-4 py-2 gap-2">
        <span class="material-symbols-outlined text-slate-500">search</span>
        <input class="bg-transparent border-none focus:ring-0 text-sm text-on-surface w-64 placeholder:text-slate-400" placeholder="Tìm kiếm chuyến đi..." type="text"/>
      </div>
      <div class="flex items-center gap-4">
        <div class="p-2 rounded-full hover:bg-surface-container transition-all cursor-pointer text-slate-500 dark:text-slate-400">
          <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
        </div>
        <div class="p-2 rounded-full hover:bg-surface-container transition-all cursor-pointer text-slate-500 dark:text-slate-400">
          <span class="material-symbols-outlined" data-icon="settings">settings</span>
        </div>
        <div class="w-10 h-10 rounded-full bg-primary-fixed overflow-hidden cursor-pointer active:scale-95 duration-200">
        </div>
      </div>
    </div>
  </header>
  <div class="flex pt-20">
    <!-- SideNavBar -->
    <aside class="hidden md:flex h-screen w-72 flex-col fixed left-0 top-0 pt-24 bg-slate-50 dark:bg-slate-900 px-4 py-6 gap-2">
      <div class="px-4 mb-8">
        <p class="text-xs font-bold uppercase tracking-widest text-secondary mb-1">Elite Explorer</p>
        <h2 class="text-xl font-black text-blue-900 dark:text-blue-400 font-headline">Chào mừng trở lại</h2>
      </div>
      <nav class="flex flex-col gap-2">
        <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800/30 transition-transform duration-300 hover:translate-x-1 rounded-xl font-medium text-sm"
           th:href="@{/customer/profile}">
          <span class="material-symbols-outlined" data-icon="person">person</span>
          <span>Profile</span>
        </a>
        <a th:href="@{/customer/booking}" class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800/30 transition-transform duration-300 hover:translate-x-1 rounded-xl font-medium text-sm" >
          <span class="material-symbols-outlined" data-icon="travel_explore">travel_explore</span>
          <span>My Bookings</span>
        </a>
        <a th:href="@{/customer/payment-history}"
           class="flex items-center gap-3 px-4 py-3 rounded-xl
            transition-transform duration-300 hover:translate-x-1 text-sm"
           th:classappend="${#execInfo.templateName == 'payment_history'}
           ? ' bg-white dark:bg-slate-800 text-blue-900 dark:text-white rounded-xl shadow-sm font-bold'
            : ' text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800/30 font-medium'">
          <span class="material-symbols-outlined">payments</span>
          <span>Payment History</span>
        </a>
      </nav>
      <div class="mt-auto flex flex-col gap-2 border-t border-slate-200 dark:border-slate-800 pt-6">
        <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800/30 transition-transform duration-300 hover:translate-x-1 rounded-xl font-medium text-sm" href="#">
          <span class="material-symbols-outlined" data-icon="help">help</span>
          <span>Help Center</span>
        </a>
        <a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:bg-slate-200/50 dark:hover:bg-slate-800/30 transition-transform duration-300 hover:translate-x-1 rounded-xl font-medium text-sm" href="#">
          <span class="material-symbols-outlined" data-icon="logout">logout</span>
          <span>Sign Out</span>
        </a>
      </div>
    </aside>
    <!-- Main Content Area -->
    <main class="flex-1 md:ml-72">
      <div layout:fragment="content"></div>
    </main>
  </div>
  <!-- Mobile Bottom Navigation (Platform Pivot Rule) -->
  <nav class="md:hidden fixed bottom-0 left-0 w-full bg-white dark:bg-slate-950 border-t border-slate-100 dark:border-slate-800 flex justify-around items-center h-20 px-4 z-50">
    <button class="flex flex-col items-center gap-1 text-slate-400">
      <span class="material-symbols-outlined" data-icon="home">home</span>
      <span class="text-[10px] font-bold">Trang chủ</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-primary">
      <span class="material-symbols-outlined" data-icon="travel_explore" style="font-variation-settings: 'FILL' 1;">travel_explore</span>
      <span class="text-[10px] font-bold">Chuyến đi</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-slate-400">
      <span class="material-symbols-outlined" data-icon="favorite">favorite</span>
      <span class="text-[10px] font-bold">Yêu thích</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-slate-400">
      <span class="material-symbols-outlined" data-icon="person">person</span>
      <span class="text-[10px] font-bold">Hồ sơ</span>
    </button>
  </nav>
  </body></html>
