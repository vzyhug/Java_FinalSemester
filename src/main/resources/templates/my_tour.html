<!DOCTYPE html>

<html lang="vi" xmlns:th="http://www.thymeleaf.org"  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{user_layout}">

<div layout:fragment="content">
  <div class="flex-1 md:ml-72 p-6 md:p-12">
    <div class="max-w-6xl mx-auto">
      <header class="mb-12">
        <span class="text-secondary font-bold text-sm uppercase tracking-widest block mb-2">Hành trình của bạn</span>
        <h1 class="text-4xl md:text-5xl font-black text-primary tracking-tight font-headline">Chuyến đi của tôi</h1>
      </header>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!--Danh sach các tour-->
        <div th:each="booking: ${listBooking}">
          <div class="group relative bg-surface-container-lowest rounded-xl overflow-hidden flex flex-col md:flex-row transition-all duration-500 hover:translate-y-[-4px]">
          <div class="md:w-2/5 relative h-64 md:h-auto overflow-hidden">
            <img alt="Image tour" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" data-alt="Breathtaking aerial view of limestone karsts rising from emerald waters in Ha Long Bay at sunrise with ethereal mist"
                 th:src="${booking.departure.tour.imagesThumbnails!=null ? booking.departure.tour.imagesThumbnails.imgURL: ''}"/>
            <div class="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-tighter text-primary">Sắp tới</div>
          </div>
          <div class="md:w-3/5 p-6 md:p-8 flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-4">
                <h3 th:text="${booking.departure.tour.title}"
                    class="text-2xl font-bold text-primary leading-tight font-headline">
                </h3>
              </div>
              <div class="space-y-3 mb-8">
                <div class="flex items-center gap-3 text-slate-500">
                  <span class="material-symbols-outlined text-lg">calendar_today</span>
                  <span th:text="${#temporals.format(booking.departure.departureDate, 'dd/MM/yyyy')}" class="text-sm font-medium"></span>
                </div>
                <div class="flex items-center gap-3 text-slate-500">
                  <span class="material-symbols-outlined text-lg">location_on</span>
                  <span th:text="${booking.departure.tour.province.provinceName}" class="text-sm font-medium"></span>
                </div>
                <div class="flex items-center gap-3 text-slate-500">
                  <span class="material-symbols-outlined text-lg">confirmation_number</span>
                  <span class="text-sm font-medium">Mã: <span th:text="${booking.bookingCode}" class="text-on-surface font-bold"></span></span>
                </div>
              </div>
            </div>
            <a th:href="@{/customer/booking/{idBooking}(idBooking=${booking.bookingId})}" class="w-full py-4 bg-gradient-to-r from-primary to-primary-container text-white rounded-full font-bold flex items-center justify-center gap-2 group-hover:shadow-xl transition-all active:scale-95 duration-200">
              Xem chi tiết
              <span class="material-symbols-outlined text-sm">arrow_forward</span>
            </a>
          </div>
        </div>
        </div>
      </div>
    </div>
  </div>
</div>
