<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/admin_layout :: layout(~{:: #add-tour-content})}">
<head>
    <meta charset="utf-8"/>
    <title>Thêm Tour Mới - Vietnam Expeditions</title>
</head>
<body>
<div id="add-tour-content" class="p-8">

    <div class="mb-8 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-black text-blue-900 mb-2">Thêm Tour Mới</h1>
            <p class="text-slate-500">Khởi tạo thông tin cơ bản cho chuyến đi mới</p>
        </div>
        <a th:href="@{/tour/manager}" class="bg-slate-200 text-slate-700 px-6 py-3 rounded-xl font-bold flex items-center gap-2 hover:bg-slate-300 transition">
            <span class="material-symbols-outlined text-lg">arrow_back</span>
            Quay lại danh sách
        </a>
    </div>

    <div th:if="${error}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded-lg shadow-sm flex items-center max-w-3xl">
        <span class="material-symbols-outlined mr-2">error</span>
        <span th:text="${error}"></span>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden max-w-3xl">
        <div class="bg-gradient-to-r from-blue-900 to-blue-700 px-8 py-6">
            <h2 class="text-xl font-bold text-white">Thông tin Tour</h2>
        </div>

        <form method="POST" th:action="@{/tour/save}" class="p-8 space-y-6">

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Tên Tour *</label>
                <input type="text" name="title" placeholder="Nhập tên tour (VD: Khám phá Vịnh Hạ Long)" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required/>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Danh mục *</label>
                    <select name="categoryId" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        <option value="">-- Chọn danh mục --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.categoryName}">Danh mục</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Địa điểm *</label>
                    <select name="provinceId" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        <option value="">-- Chọn địa điểm --</option>
                        <option th:each="prov : ${provinces}" th:value="${prov.provinceId}" th:text="${prov.provinceName}">Địa điểm</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Mô tả tổng quan</label>
                <textarea name="description" placeholder="Nhập mô tả hấp dẫn về chuyến đi..." rows="4" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Số ngày *</label>
                    <input type="number" name="durationDays" placeholder="Ví dụ: 3" min="1" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required/>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Số đêm *</label>
                    <input type="number" name="durationNights" placeholder="Ví dụ: 2" min="0" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required/>
                </div>
            </div>

            <div class="bg-blue-50 p-4 rounded-xl flex gap-3 items-start border border-blue-100 mt-4">
                <span class="material-symbols-outlined text-blue-600">info</span>
                <p class="text-sm text-blue-800">
                    <strong>Lưu ý:</strong> Giá tour, phương tiện và lịch trình chi tiết sẽ được thiết lập sau khi bạn tạo tour thành công.
                </p>
            </div>

            <div class="pt-6 border-t border-slate-100 flex justify-end gap-4">
                <a th:href="@{/tour/manager}" class="px-6 py-3 border border-slate-200 text-slate-700 rounded-xl hover:bg-slate-50 transition font-bold">
                    Hủy bỏ
                </a>
                <button type="submit" class="px-8 py-3 bg-green-600 text-white rounded-xl hover:bg-green-700 transition font-bold shadow-sm flex items-center gap-2">
                    <span class="material-symbols-outlined text-lg">save</span>
                    Lưu Tour Mới
                </button>
            </div>
        </form>
    </div>

</div>
</body>
</html>
