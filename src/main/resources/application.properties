spring.application.name=booking_tour
spring.datasource.url=jdbc:mysql://localhost:3306/TourDB
spring.datasource.username=root
spring.datasource.password=123

#spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8080
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.thymeleaf.encoding=UTF-8
# Cau hinh dung luong upload file anh
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Giữ phiên đăng nhập cho khách hàng kể cả khi tắt trình duyệt (30 ngày)
server.servlet.session.cookie.max-age=2592000
server.servlet.session.timeout=30d

# Cho phép Tomcat lưu session xuống ổ cứng khi dừng server (Stop) và nạp lại khi chạy lại (Start)
server.servlet.session.persistent=true